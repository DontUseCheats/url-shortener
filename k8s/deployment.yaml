apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
      - name: flask
        image: 801498844513.dkr.ecr.us-west-1.amazonaws.com/url-shortener:latest
        ports:
        - containerPort: 5000